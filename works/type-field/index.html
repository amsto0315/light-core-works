<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字场 · TYPE FIELD</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f2ead9'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='serif' font-size='42' fill='%231d302d'%3E字%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --paper:#efe8d8;
    --paper-deep:#e6ddc9;
    --ink:#1d302d;
    --ink-soft:#50605a;
    --ink-faint:#8a9289;
    --line:#d8cfbd;
    --coral:#d65d45;
    --teal:#4d7f70;
    --gold:#c3964d;
    --card:#f7f2e7;
  }
  *{box-sizing:border-box;}
  html{background:var(--paper);}
  body{
    margin:0;min-height:100vh;color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;
    background:
      radial-gradient(circle at 85% -5%,rgba(77,127,112,.12),transparent 34%),
      radial-gradient(circle at 0% 100%,rgba(214,93,69,.09),transparent 34%),
      var(--paper);
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;
    background-image:repeating-linear-gradient(0deg,rgba(29,48,45,.035) 0 1px,transparent 1px 4px);
    mix-blend-mode:multiply;
  }
  .page{position:relative;width:min(1500px,calc(100% - 40px));margin:0 auto;padding:24px 0 34px;}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:30px;padding:6px 4px 22px;border-bottom:1px solid var(--line);}
  .brand .eyebrow{font-size:9px;letter-spacing:.3em;color:var(--teal);font-weight:800;}
  h1{
    margin:9px 0 5px;font-family:"Songti SC","STSong","Noto Serif SC",Georgia,serif;
    font-size:clamp(34px,4.8vw,62px);font-weight:600;letter-spacing:.08em;line-height:1;
  }
  .brand .sub{font-size:10px;letter-spacing:.32em;color:var(--ink-faint);text-transform:uppercase;}
  .head-note{max-width:310px;font-size:11px;line-height:1.9;color:var(--ink-soft);text-align:right;padding-bottom:4px;}
  .head-note b{color:var(--ink);font-weight:700;}
  .workbench{display:grid;grid-template-columns:330px minmax(0,1fr);gap:30px;margin-top:24px;align-items:start;}
  .controls{
    position:sticky;top:24px;padding:20px 20px 18px;border-radius:18px;
    background:rgba(247,242,231,.82);border:1px solid rgba(255,255,255,.7);
    box-shadow:0 16px 40px rgba(70,60,40,.08);backdrop-filter:blur(10px);
  }
  .section-label{font-size:9px;font-weight:800;letter-spacing:.2em;color:var(--ink-faint);margin:0 0 8px;}
  .field{margin-bottom:16px;}
  .field > label{display:block;font-size:10px;color:var(--ink-soft);font-weight:700;letter-spacing:.08em;margin-bottom:6px;}
  textarea,input[type=text],input[type=number]{
    width:100%;border:1px solid var(--line);border-radius:9px;background:#fffdf7;color:var(--ink);
    font:inherit;font-size:13px;padding:10px 11px;outline:none;transition:.18s;
  }
  textarea{resize:vertical;min-height:70px;line-height:1.6;}
  textarea:focus,input:focus{border-color:var(--coral);box-shadow:0 0 0 3px rgba(214,93,69,.1);}
  .row-2{display:grid;grid-template-columns:1fr 72px;gap:8px;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{
    border:1px solid var(--line);background:#fffdf7;color:var(--ink-soft);
    border-radius:8px;padding:6px 9px;font:inherit;font-size:10px;cursor:pointer;transition:.16s;
  }
  .chip:hover{border-color:#bfb3a0;color:var(--ink);}
  .chip.active{border-color:var(--ink);background:var(--ink);color:#f7f2e7;}
  .swatches{display:flex;gap:8px;}
  .swatch{
    width:42px;height:29px;border-radius:7px;border:1px solid rgba(29,48,45,.15);
    cursor:pointer;position:relative;transition:.16s;overflow:hidden;
  }
  .swatch.active{box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--ink);}
  .swatch span{position:absolute;inset:0;display:grid;place-items:center;font-size:9px;color:#fff;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.3);}
  .range-row{display:flex;align-items:center;gap:9px;}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:2px;background:#d8cfbd;outline:none;border-radius:99px;cursor:pointer;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--ink);cursor:pointer;box-shadow:0 0 0 3px rgba(29,48,45,.08);}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--ink);}
  .range-val{width:31px;text-align:right;font-size:10px;color:var(--ink-faint);font-variant-numeric:tabular-nums;}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}
  .btn{
    height:38px;border:1px solid var(--line);border-radius:9px;background:#fffdf7;color:var(--ink);
    font:inherit;font-size:11px;cursor:pointer;transition:.16s;letter-spacing:.04em;
  }
  .btn:hover{border-color:#b9ac98;transform:translateY(-1px);}
  .btn.primary{grid-column:1/-1;background:var(--ink);border-color:var(--ink);color:#f7f2e7;font-weight:700;letter-spacing:.1em;}
  .btn.primary:hover{background:#2b443f;}
  .btn.small{font-size:10px;}
  .stage{min-width:0;display:flex;flex-direction:column;align-items:center;padding-top:2px;}
  .poster-wrap{
    position:relative;width:min(100%,680px);aspect-ratio:3/4;
    background:#fffdf7;padding:12px;border-radius:4px;
    box-shadow:0 30px 70px rgba(60,50,35,.18),0 3px 8px rgba(60,50,35,.08);
    transform:rotate(-.25deg);
  }
  .poster-wrap::after{
    content:"";position:absolute;inset:0;pointer-events:none;border:1px solid rgba(29,48,45,.08);
  }
  #poster{display:block;width:100%;height:100%;background:#efe8d8;}
  .caption{
    width:min(100%,680px);display:flex;justify-content:space-between;gap:20px;
    margin-top:14px;font-size:9px;letter-spacing:.08em;color:var(--ink-faint);
  }
  .caption b{color:var(--ink-soft);font-weight:700;}
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;pointer-events:none;
    background:var(--ink);color:#f7f2e7;border-radius:9px;padding:10px 16px;font-size:11px;
    box-shadow:0 16px 30px rgba(29,48,45,.24);transition:.2s;z-index:20;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}
  .footer{margin-top:26px;padding:0 4px;display:flex;justify-content:space-between;gap:20px;color:var(--ink-faint);font-size:9px;line-height:1.8;letter-spacing:.04em;border-top:1px solid var(--line);padding-top:14px;}
  @media(max-width:900px){
    .page{width:calc(100% - 24px);}
    header{align-items:flex-start;flex-direction:column;gap:12px;}
    .head-note{text-align:left;max-width:100%;}
    .workbench{grid-template-columns:1fr;gap:20px;}
    .controls{position:static;order:2;}
    .stage{order:1;}
    .poster-wrap{width:min(100%,620px);}
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="brand">
      <div class="eyebrow">TYPE FIELD · 03</div>
      <h1>字场</h1>
      <div class="sub">A GENERATIVE TYPE POSTER STUDIO</div>
    </div>
    <div class="head-note"><b>输入一句话，把它变成一张独一无二的海报。</b><br>每个种子都会生成不同的字形密度、流场和配色；所有图形由算法实时绘制，可导出 PNG / SVG。</div>
  </header>

  <div class="workbench">
    <aside class="controls">
      <div class="field">
        <label for="phrase">海报文字</label>
        <textarea id="phrase" maxlength="80">光在看见时发生</textarea>
      </div>
      <div class="field">
        <label>构图</label>
        <div class="chips" id="layoutChips">
          <button class="chip active" data-layout="flow" type="button">流场</button>
          <button class="chip" data-layout="radial" type="button">径向</button>
          <button class="chip" data-layout="wave" type="button">波纹</button>
        </div>
      </div>
      <div class="field">
        <label>配色</label>
        <div class="swatches" id="paletteChips">
          <button class="swatch active" data-palette="paper" type="button" style="background:linear-gradient(135deg,#efe8d8 0 55%,#1d302d 55% 78%,#d65d45 78%)" aria-label="纸本"></button>
          <button class="swatch" data-palette="night" type="button" style="background:linear-gradient(135deg,#101918 0 55%,#d8e3d4 55% 78%,#ff8268 78%)" aria-label="夜场"></button>
          <button class="swatch" data-palette="blue" type="button" style="background:linear-gradient(135deg,#e7edf0 0 55%,#1c3a4a 55% 78%,#d6a24a 78%)" aria-label="蓝纸"></button>
        </div>
      </div>
      <div class="field">
        <label>密度 <span style="float:right;color:var(--ink-faint)">字形数量</span></label>
        <div class="range-row"><input id="density" type="range" min="18" max="62" step="1" value="26"><span class="range-val" id="densityVal">26</span></div>
      </div>
      <div class="field">
        <label>扰动 <span style="float:right;color:var(--ink-faint)">流场强度</span></label>
        <div class="range-row"><input id="distort" type="range" min="0" max="1" step=".02" value=".62"><span class="range-val" id="distortVal">.62</span></div>
      </div>
      <div class="field">
        <label for="seed">种子</label>
        <div class="row-2">
          <input id="seed" type="number" min="0" max="999999" value="20270109">
          <button class="chip" id="seedBtn" type="button">随机</button>
        </div>
      </div>
      <div class="actions">
        <button class="btn primary" id="generateBtn" type="button">生成海报</button>
        <button class="btn small" id="pngBtn" type="button">导出 PNG</button>
        <button class="btn small" id="svgBtn" type="button">导出 SVG</button>
      </div>
    </aside>

    <section class="stage">
      <div class="poster-wrap"><canvas id="poster" width="1200" height="1600"></canvas></div>
      <div class="caption"><span><b>TYPE FIELD</b> / 生成式字体海报</span><span id="meta">SEED 20270109 · 1200 × 1600</span></div>
    </section>
  </div>

  <div class="footer"><span>所有文字与图形均由本地算法生成，未使用外部图片或字体素材。</span><span>Ctrl / Cmd + Enter 生成 · 保存设置至本地</span></div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';
  const canvas = document.getElementById('poster');
  const ctx = canvas.getContext('2d');
  const W = 1200, H = 1600;
  const KEY = 'type-field-settings-v1';
  const palettes = {
    paper: {bg:'#efe8d8', ink:'#1d302d', accent:'#d65d45', second:'#4d7f70', faint:'#b7ac95', paper:'#f7f1e4'},
    night: {bg:'#101918', ink:'#d8e3d4', accent:'#ff8268', second:'#7fe3c1', faint:'#40514a', paper:'#e8f0e8'},
    blue: {bg:'#e7edf0', ink:'#1c3a4a', accent:'#d6a24a', second:'#6f97a8', faint:'#aebdc4', paper:'#f4f8f9'}
  };
  const state = {
    phrase:'光在看见时发生',
    layout:'flow',
    palette:'paper',
    density:26,
    distort:.62,
    seed:20270109
  };

  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      if(!raw) return;
      const data = JSON.parse(raw);
      Object.keys(state).forEach(k => { if(data[k] !== undefined) state[k] = data[k]; });
      state.density = Math.max(18, Math.min(62, Number(state.density)||26));
      state.distort = Math.max(0, Math.min(1, Number(state.distort)||.62));
      state.seed = Math.max(0, Math.min(999999, Number(state.seed)||20270109));
      if(!palettes[state.palette]) state.palette='paper';
      if(!['flow','radial','wave'].includes(state.layout)) state.layout='flow';
    }catch(e){}
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }

  // deterministic 2D value noise
  function hash2(x, y, s){
    let h = Math.imul(x|0, 374761393) + Math.imul(y|0, 668265263) + Math.imul(s|0, 1442695041);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
  }
  function smooth(t){ return t*t*(3-2*t); }
  function noise2(x, y, s){
    const xi=Math.floor(x), yi=Math.floor(y);
    const xf=x-xi, yf=y-yi;
    const u=smooth(xf), v=smooth(yf);
    const a=hash2(xi,yi,s), b=hash2(xi+1,yi,s), c=hash2(xi,yi+1,s), d=hash2(xi+1,yi+1,s);
    return (a*(1-u)+b*u)*(1-v) + (c*(1-u)+d*u)*v;
  }
  function fbm(x,y,s){
    return noise2(x,y,s)*.62 + noise2(x*2.1,y*2.1,s+17)*.26 + noise2(x*4.2,y*4.2,s+41)*.12;
  }

  function layoutGlyphs(){
    const p = palettes[state.palette];
    const chars = Array.from(state.phrase.replace(/\s+/g,''));
    const glyphs = chars.length ? chars : ['字'];
    const items = [];
    const margin = 78;
    const innerW = W - margin*2, innerH = H - margin*2;
    const spacing = 1000 / state.density * 1.18;
    const cols = Math.max(8, Math.floor(innerW / spacing));
    const rows = Math.max(10, Math.floor(innerH / spacing));
    const cellW = innerW / cols, cellH = innerH / rows;
    const cx = W*.5, cy = H*.46;

    for(let row=0; row<rows; row++){
      for(let col=0; col<cols; col++){
        const u = (col+.5)/cols, v = (row+.5)/rows;
        const baseX = margin + (col+.5)*cellW;
        const baseY = margin + (row+.5)*cellH;
        const nx = (baseX - cx) / W, ny = (baseY - cy) / H;
        const n = fbm(u*3.1 + state.seed*.001, v*3.1 + state.seed*.0017, state.seed);
        const n2 = fbm(u*6.4 + 11, v*6.4 + 23, state.seed+91);
        let x=baseX, y=baseY, angle=0, scale=1, alpha=1;
        if(state.layout === 'flow'){
          const a = (n-.5)*Math.PI*2.2*state.distort;
          const len = (n2-.5)*cellW*.55*state.distort;
          x += Math.cos(a)*len;
          y += Math.sin(a)*len;
          angle = a;
          scale = .55 + n2*.9;
        } else if(state.layout === 'radial'){
          const dx=baseX-cx, dy=baseY-cy;
          const r=Math.hypot(dx,dy);
          const th=Math.atan2(dy,dx) + (n-.5)*.9*state.distort;
          const rr=r + (n2-.5)*90*state.distort;
          x = cx + Math.cos(th)*rr;
          y = cy + Math.sin(th)*rr;
          angle = th + Math.PI/2;
          scale = .55 + (1 - Math.min(1,r/650))*.8 + n2*.2;
        } else {
          y += Math.sin(u*Math.PI*5 + state.seed*.01)*cellH*(n-.5)*2.2*state.distort;
          x += Math.cos(v*Math.PI*3 + n2*4)*cellW*.32*state.distort;
          angle = Math.sin(v*Math.PI*4)*.35*state.distort;
          scale = .66 + n*.55;
        }
        const glyph = glyphs[(row*7 + col*3 + Math.floor(n*11)) % glyphs.length];
        const accent = n2 > .78 || (state.layout==='radial' && Math.hypot(x-cx,y-cy) < 150);
        alpha = .22 + Math.max(0, Math.min(1, n2)) * .68;
        items.push({x,y,angle,scale,alpha,glyph,accent,size:cellW*.92});
      }
    }
    return {items, chars:glyphs, p, margin};
  }

  function render(){
    const p = palettes[state.palette];
    const data = layoutGlyphs();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle = p.bg;
    ctx.fillRect(0,0,W,H);

    // subtle paper grain
    ctx.save();
    ctx.globalAlpha = .10;
    for(let i=0;i<900;i++){
      const x = hash2(i,3,state.seed)*W;
      const y = hash2(i,9,state.seed+7)*H;
      ctx.fillStyle = i%3 ? p.faint : p.ink;
      ctx.fillRect(x,y,1.2,1.2);
    }
    ctx.restore();

    // thin registration frame
    ctx.strokeStyle = p.ink;
    ctx.globalAlpha = .28;
    ctx.lineWidth = 1;
    ctx.strokeRect(data.margin*.78, data.margin*.78, W-data.margin*1.56, H-data.margin*1.56);
    ctx.globalAlpha = 1;

    ctx.textAlign='center';
    ctx.textBaseline='middle';
    data.items.forEach((g, idx) => {
      ctx.save();
      ctx.translate(g.x,g.y);
      ctx.rotate(g.angle);
      const size = g.size * g.scale;
      const family = '"Songti SC","STSong","Noto Serif SC",Georgia,serif';
      ctx.font = `${size.toFixed(1)}px ${family}`;
      ctx.globalAlpha = g.alpha;
      ctx.fillStyle = g.accent ? p.accent : (idx % 13 === 0 ? p.second : p.ink);
      ctx.fillText(g.glyph,0,0);
      ctx.restore();
    });

    // center title / small edition mark
    const title = state.phrase.replace(/\s+/g,' ').slice(0,24);
    ctx.save();
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    const titleSize = Math.min(70, Math.max(44, 720 / Math.max(8, title.length)));
    ctx.font = `${titleSize}px "Songti SC","STSong","Noto Serif SC",Georgia,serif`;
    const titleW = Math.min(W*.78, ctx.measureText(title).width + 82);
    const titleH = titleSize + 46;
    ctx.globalAlpha = .91;
    ctx.fillStyle = p.bg;
    ctx.beginPath(); ctx.roundRect(W*.5-titleW*.5, H*.46-titleH*.5, titleW, titleH, 8); ctx.fill();
    ctx.globalAlpha = .55;
    ctx.fillStyle = p.accent;
    ctx.fillRect(W*.5-titleW*.5, H*.46+titleH*.5-4, titleW, 2);
    ctx.globalAlpha = .96;
    ctx.fillStyle = p.ink;
    ctx.fillText(title, W*.5, H*.46);
    ctx.globalAlpha = .45;
    ctx.font = '17px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.fillText('TYPE FIELD · GENERATIVE POSTER', W*.5, H*.46 + titleH*.5 + 23);
    ctx.restore();

    // footer metadata
    ctx.save();
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    ctx.fillStyle = p.ink; ctx.globalAlpha=.55;
    ctx.font='17px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.fillText('光 / 在看见时发生', data.margin*.78, H-data.margin*.58);
    ctx.textAlign='right';
    ctx.fillText(`SEED ${String(state.seed).padStart(6,'0')} · ${state.layout.toUpperCase()}`, W-data.margin*.78, H-data.margin*.58);
    ctx.restore();

    document.getElementById('meta').textContent = `SEED ${String(state.seed).padStart(6,'0')} · 1200 × 1600 · ${state.layout.toUpperCase()}`;
    save();
  }

  function escapeXml(s){
    return String(s).replace(/[<>&"']/g, m => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[m]));
  }

  function exportSvg(){
    const p = palettes[state.palette];
    const data = layoutGlyphs();
    const parts = [];
    parts.push(`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`);
    parts.push(`<rect width="${W}" height="${H}" fill="${p.bg}"/>`);
    data.items.forEach((g,idx) => {
      const size = (g.size*g.scale).toFixed(1);
      const fill = g.accent ? p.accent : (idx%13===0 ? p.second : p.ink);
      parts.push(`<text x="${g.x.toFixed(1)}" y="${g.y.toFixed(1)}" font-family="Songti SC, STSong, serif" font-size="${size}" text-anchor="middle" dominant-baseline="middle" fill="${fill}" fill-opacity="${g.alpha.toFixed(2)}" transform="rotate(${(g.angle*180/Math.PI).toFixed(2)} ${g.x.toFixed(1)} ${g.y.toFixed(1)})">${escapeXml(g.glyph)}</text>`);
    });
    const title = state.phrase.replace(/\s+/g,' ').slice(0,24);
    const titleSize = Math.min(70, Math.max(44, 720 / Math.max(8,title.length)));
    parts.push(`<rect x="270" y="${(H*.46-titleSize*.5-23).toFixed(1)}" width="660" height="${(titleSize+46).toFixed(1)}" rx="8" fill="${p.bg}" fill-opacity=".92"/>`);
    parts.push(`<text x="${W*.5}" y="${(H*.46).toFixed(1)}" font-family="Songti SC, STSong, serif" font-size="${titleSize.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" fill="${p.ink}">${escapeXml(title)}</text>`);
    parts.push(`<rect x="270" y="${(H*.46+titleSize*.5+20).toFixed(1)}" width="660" height="2" fill="${p.accent}" fill-opacity=".55"/>`);
    parts.push(`<text x="${W*.5}" y="${(H*.46+titleSize*.5+48).toFixed(1)}" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle" fill="${p.ink}" fill-opacity=".45">TYPE FIELD · GENERATIVE POSTER</text>`);
    parts.push(`</svg>`);
    const blob = new Blob([parts.join('')],{type:'image/svg+xml'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `type-field-${state.seed}.svg`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    toast('SVG 已导出');
  }

  function toast(text){
    const el = document.getElementById('toast');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(()=>el.classList.remove('show'),2200);
  }

  function syncUI(){
    document.getElementById('phrase').value = state.phrase;
    document.getElementById('density').value = state.density;
    document.getElementById('distort').value = state.distort;
    document.getElementById('seed').value = state.seed;
    document.getElementById('densityVal').textContent = state.density;
    document.getElementById('distortVal').textContent = state.distort.toFixed(2).replace(/^0/,'');
    document.querySelectorAll('[data-layout]').forEach(b=>b.classList.toggle('active', b.dataset.layout===state.layout));
    document.querySelectorAll('[data-palette]').forEach(b=>b.classList.toggle('active', b.dataset.palette===state.palette));
  }

  document.getElementById('generateBtn').addEventListener('click', ()=>{ render(); toast('已生成新海报'); });
  document.getElementById('seedBtn').addEventListener('click', ()=>{
    state.seed = Math.floor(Math.random()*999999);
    document.getElementById('seed').value = state.seed;
    render(); toast('新种子');
  });
  document.getElementById('pngBtn').addEventListener('click', ()=>{
    const a=document.createElement('a');
    a.download=`type-field-${state.seed}.png`;
    a.href=canvas.toDataURL('image/png');
    a.click();
    toast('PNG 已导出');
  });
  document.getElementById('svgBtn').addEventListener('click', exportSvg);

  document.getElementById('phrase').addEventListener('input', e=>{ state.phrase=e.target.value || '光在看见时发生'; save(); });
  document.getElementById('density').addEventListener('input', e=>{
    state.density=Number(e.target.value); document.getElementById('densityVal').textContent=state.density; save();
  });
  document.getElementById('distort').addEventListener('input', e=>{
    state.distort=Number(e.target.value); document.getElementById('distortVal').textContent=state.distort.toFixed(2).replace(/^0/,''); save();
  });
  document.getElementById('seed').addEventListener('change', e=>{
    state.seed = Math.max(0, Math.min(999999, Number(e.target.value)||0)); save();
  });
  document.getElementById('layoutChips').addEventListener('click', e=>{
    const b=e.target.closest('[data-layout]'); if(!b)return;
    state.layout=b.dataset.layout; syncUI(); render(); toast('构图已切换');
  });
  document.getElementById('paletteChips').addEventListener('click', e=>{
    const b=e.target.closest('[data-palette]'); if(!b)return;
    state.palette=b.dataset.palette; syncUI(); render(); toast('配色已切换');
  });

  window.addEventListener('keydown', e=>{
    if((e.ctrlKey||e.metaKey) && e.key==='Enter'){ e.preventDefault(); render(); toast('已生成新海报'); }
    if(e.key==='r' && !['TEXTAREA','INPUT'].includes(document.activeElement.tagName)){
      document.getElementById('seedBtn').click();
    }
  });

  load();
  syncUI();
  render();
})();
</script>
</body>
</html>
